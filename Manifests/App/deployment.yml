apiVersion: apps/v1
kind: Deployment
metadata:
  name: filmsearch-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filmsearch-app
  template:
    metadata:
      labels:
        app: filmsearch-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: filmsearch-app
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          envFrom:
            - secretRef:
                name: filmsearch-secrets
            - configMapRef:
                name: filmsearch-config
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: DOTNET_USE_POLLING_FILE_WATCHER
              value: "true"
            - name: CONFIG_PATH
              value: /app/config/appsettings.json
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: filmsearch-config