apiVersion: v1
kind: ConfigMap
metadata:
  name: filmsearch-config
data:
  appsettings.json: |
    {
      "S3": {
        "ServiceUrl": "https://s3.yandexcloud.net",
        "BucketName": "filmsearch",
        "AuthenticationRegion": "ru-central1"
      },
      "MetricsPort": "8081",
      "FailureSettings": {
        "Enabled" : false,
        "ErrorChance": 0,
        "Latency": 500
      }
    }