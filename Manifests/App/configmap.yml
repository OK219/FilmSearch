apiVersion: v1
kind: ConfigMap
metadata:
  name: filmsearch-config
data:
  appsettings.json: |
    {
      "S3": {
        "ServiceUrl": "https://s3.yandexcloud.net",
        "BucketName": "filmsearch",
        "AuthenticationRegion": "ru-central1"
      },
      "MetricsPort": "8081",
      "FailureSettings": {
        "Enabled" : false,
        "ErrorChance": 0.9,
        "Latency": 450
      },
      "Redis": {
        "ConnectionString": "redis-service:6379,abortConnect=false,connectTimeout=5000,syncTimeout=5000"
      }
    }