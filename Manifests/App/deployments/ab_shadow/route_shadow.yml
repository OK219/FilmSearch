apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filmsearch-app
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: filmsearch-app-1
          port: 80
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: filmsearch-app-2
              port: 80
