apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filmsearch-app
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: filmsearch-app-2
          port: 80
    - backendRefs:
        - name: filmsearch-app-1
          port: 80
