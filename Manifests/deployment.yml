apiVersion: apps/v1
kind: Deployment
metadata:
  name: filmsearch-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filmsearch-app
  template:
    metadata:
      labels:
        app: filmsearch-app
    spec:
      containers:
        - name: app
          image: filmsearch-app
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: filmsearch-secrets
            - configMapRef:
                name: filmsearch-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3