apiVersion: batch/v1
kind: Job
metadata:
  name: filmsearch-migrator
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 360
  template:
    metadata:
      labels:
        app: filmsearch-migrator
    spec:
      restartPolicy: Never
      containers:
        - name: migrator
          image: filmsearch-migrator:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: filmsearch-database-secrets
            - configMapRef:
                name: filmsearch-config
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: DOTNET_USE_POLLING_FILE_WATCHER
              value: "true"
            - name: CONFIG_PATH
              value: /app/config/appsettings.json
            - name: VER
              value: "V1"
            - name: POSTGRES_USER_READONLY
              value: "$(POSTGRES_USER_READONLY)"
            - name: POSTGRES_PASSWORD_READONLY
              value: "$(POSTGRES_PASSWORD_READONLY)"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: filmsearch-config